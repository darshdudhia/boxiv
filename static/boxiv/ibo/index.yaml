desc: |
  The International Biology Olympiad (IBO) is a global competition for pre-university students under the age of 20, held annually since 1990. It features theoretical and practical exam components, with practicals often split across several biology sub-disciplines (biochemistry, molecular biology, plant and animal anatomy, ecology, bioinformatics, and more). This archive contains publicly shared problem and solution PDFs from past IBO editions, sourced from the official IBO archive.
