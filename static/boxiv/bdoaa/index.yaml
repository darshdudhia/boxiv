desc: |
  The Bangladesh Astronomy and Astrophysics Olympiad (BDOAA) is a national competition for students in Bangladesh, serving as a pathway to selection for the International Olympiad on Astronomy and Astrophysics (IOAA). The competition tests theoretical knowledge, observational skills, and problem-solving abilities in astronomy and astrophysics. Top performers from BDOAA proceed to orientation camps and further selection rounds for international representation.
