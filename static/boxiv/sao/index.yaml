desc: |
  The Singapore Astronomy Olympiad (SAO) serves as the primary selection mechanism for Singapore's team to the International Olympiad on Astronomy and Astrophysics (IOAA). The competition tests theoretical knowledge, observational skills, and problem-solving abilities in astronomy and astrophysics. Top performers from SAO proceed to orientation camps and further selection rounds for international representation.
