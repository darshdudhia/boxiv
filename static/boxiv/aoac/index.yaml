desc: |
  The AO Guide Astrophysics Challenge (AOAC) is an international astronomy competition that tests students' knowledge in observational and theoretical astronomy. The competition consists of two main divisions: Open and Invitational. The Open division is accessible to all students worldwide, while the Invitational division is for top performers and features more challenging problems. AOAC emphasizes practical astronomy skills including data analysis, celestial mechanics, and astrophysics.
