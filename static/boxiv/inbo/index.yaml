desc: 'The Indian National Biology Olympiad (INBO) is a national-level theory examination administered
  by HBCSE-TIFR as part of India''s multi-stage biology olympiad selection process, which eventually leads
  to the International Biology Olympiad (IBO). This archive contains publicly shared question papers,
  solutions, and answer booklets from past INBO editions.

