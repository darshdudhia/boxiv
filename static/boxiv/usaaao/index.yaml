desc: |
  The USA Astronomy and Astrophysics Olympiad (USAAAO) is a national competition for high school students in the United States of America. The competition consists of multiple rounds, including a First Round and the National Astronomy Championship (NAC). Top performers from USAAAO are invited to represent the United States at the International Olympiad on Astronomy and Astrophysics (IOAA). The competition tests knowledge and problem-solving skills in astronomy, astrophysics, and related fields.
