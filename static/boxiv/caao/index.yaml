desc: |
  The Canadian Astronomy and Astrophysics Olympiad (CAAO) is a national competition for students in Canada, serving as a pathway to selection for the International Olympiad on Astronomy and Astrophysics (IOAA). The competition tests theoretical knowledge, observational skills, and problem-solving abilities in astronomy and astrophysics. Top performers from CAAO proceed to orientation camps and further selection rounds for international representation.
